<title>מעל הרשת ע״י אלי</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&family=Rubik:wght@700;900&display=swap">
<style>
/* Layout: sports desk. Brand band + league switch, a section bar where every item is its own page,
   and one reading column (max 1040px) whose blocks stack on phones. Club colours carry the identity:
   Maccabi yellow, Hapoel red, court blue for the frame. */
:root {
  --bg: #eef1f7; --surface: #ffffff; --sunk: #e4e9f2;
  --ink: #0e1730; --muted: #566180; --line: #d5dbe8;
  --band: #0a2d75; --band-ink: #ffffff; --band-soft: #173f95;
  --ball: #f4b400; --ball-ink: #201600;
  --link: #0a3fae; --win: #08744a; --wait: #9a5600; --live: #c8201c;
  --display: "Rubik", "Heebo", "Arial Hebrew", Arial, sans-serif;
  --body: "Heebo", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070c19; --surface: #101930; --sunk: #0b1325;
    --ink: #eef2fb; --muted: #9ba8c4; --line: #24304d;
    --band: #0a2256; --band-ink: #ffffff; --band-soft: #17377f;
    --ball: #ffc933; --ball-ink: #201600;
    --link: #8fb4ff; --win: #4fd39c; --wait: #ffb65c; --live: #ff6b62;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070c19; --surface: #101930; --sunk: #0b1325;
  --ink: #eef2fb; --muted: #9ba8c4; --line: #24304d;
  --band: #0a2256; --band-ink: #ffffff; --band-soft: #17377f;
  --ball: #ffc933; --ball-ink: #201600;
  --link: #8fb4ff; --win: #4fd39c; --wait: #ffb65c; --live: #ff6b62;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
a { color: var(--link); }
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) { .card, .tile, .btn { transition: transform .15s, box-shadow .15s, border-color .15s; } }

/* Brand band and section bar */
.band { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; }
.band-top { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; min-width: 0; line-height: 1.1; }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo small { display: block; font-family: var(--body); font-weight: 500; font-size: 11.5px; opacity: .8; letter-spacing: 0; margin-top: 2px; }
@media (max-width: 480px) { .logo { font-size: 18px; white-space: nowrap; } .logo svg { width: 26px; height: 26px; } .seg button { padding: 6px 11px; } }
.seg { display: flex; background: var(--band-soft); border-radius: 999px; padding: 3px; margin-inline-start: auto; flex: none; }
.seg button { border: 0; background: transparent; color: var(--band-ink); padding: 6px 15px; border-radius: 999px; font-weight: 700; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); }
.tabs { background: var(--band-soft); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs .wrap::-webkit-scrollbar { display: none; }
.tabs a { color: var(--band-ink); text-decoration: none; font-weight: 700; padding: 10px 13px; white-space: nowrap; border-bottom: 3px solid transparent; opacity: .8; }
.tabs a:hover { opacity: 1; }
.tabs a[aria-current="page"] { border-bottom-color: var(--ball); opacity: 1; }

main.wrap { padding-block: 18px 36px; display: grid; gap: 18px; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--display); font-size: clamp(22px, 5vw, 30px); line-height: 1.15; text-wrap: balance; }
.page-head p { color: var(--muted); font-size: 13.5px; }
.crumb { font-size: 13px; font-weight: 700; text-decoration: none; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; overflow: hidden; }
.box > h2 { font-family: var(--display); font-size: 17px; padding: 12px 14px; border-bottom: 2px solid var(--band); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; text-wrap: balance; }
.box > h2 a { font-family: var(--body); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.empty { padding: 18px 14px; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
@media (max-width: 800px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* Club badge */
.badge { flex: none; width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--display); font-size: 13px; letter-spacing: -.02em; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.badge.mac { background: #ffd23f; color: #0a2d75; }
.badge.hap { background: #d62f2f; color: #ffffff; }
.badge.oth { background: #0f7f86; color: #ffffff; }
.badge.lg { width: 56px; height: 56px; font-size: 20px; }
.badge.sm { width: 24px; height: 24px; font-size: 10px; border-width: 1px; }

/* Scores strip */
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
.chip { flex: none; width: 196px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; }
.chip .when { font-size: 11px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
.chip .line { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
.chip .line .nm { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1; }
.chip .line b { font-family: var(--display); font-size: 15px; }
.chip .lose { color: var(--muted); }
.tag-today { color: var(--ball-ink); background: var(--ball); border-radius: 4px; padding: 0 6px; font-weight: 700; }
.tag-wait { color: var(--wait); font-weight: 700; }

/* Next match */
.next { background: var(--band); color: var(--band-ink); border-radius: 12px; padding: 18px 16px 22px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.next::after { content: ""; position: absolute; inset: auto 0 0 0; height: 6px; background: repeating-linear-gradient(90deg, var(--ball) 0 14px, transparent 14px 20px); }
.next .eyebrow { font-size: 12.5px; font-weight: 700; color: var(--ball); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.next .teams { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: start; }
.next .side { display: grid; gap: 8px; justify-items: center; text-align: center; color: inherit; text-decoration: none; }
.next .side strong { font-family: var(--display); font-size: clamp(16px, 4.2vw, 24px); line-height: 1.15; text-wrap: balance; }
.next .side span { font-size: 12px; opacity: .8; }
.next .vs { font-family: var(--display); background: var(--ball); color: var(--ball-ink); border-radius: 50%; width: 40px; height: 40px; display: grid; place-items: center; font-size: 13px; margin-top: 8px; }
.next .meta { font-size: 13.5px; opacity: .95; display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; text-align: center; }
.next .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.next .acts a { color: var(--band-ink); border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 6px 14px; text-decoration: none; font-weight: 700; font-size: 13px; }
.next .acts a.hot { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }

/* Game rows */
.day-head { padding: 8px 14px; background: var(--sunk); font-size: 12.5px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); }
.game { padding: 12px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.game:last-child { border-bottom: 0; }
.game .top { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; justify-content: space-between; }
.game .row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.game .t { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--ink); text-decoration: none; min-width: 0; line-height: 1.25; }
.game .t span:last-child { overflow-wrap: anywhere; }
.game .t.g { flex-direction: row-reverse; text-align: end; }
.game .t.won { font-weight: 900; }
.game .t.mine span:last-child { box-shadow: inset 0 -7px 0 color-mix(in srgb, var(--ball) 55%, transparent); }
.score { display: flex; gap: 5px; align-items: center; font-family: var(--display); font-size: 21px; background: var(--sunk); border-radius: 8px; padding: 3px 12px; min-width: 70px; justify-content: center; }
.score.soon { font-family: var(--body); font-size: 14.5px; font-weight: 700; }
.score .lose { color: var(--muted); }
.sets { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.sets span { font-size: 12px; background: var(--sunk); border-radius: 5px; padding: 1px 8px; display: inline-flex; gap: 3px; color: var(--muted); }
.sets b { color: var(--ink); }
.game .foot { font-size: 12.5px; display: flex; gap: 6px 16px; justify-content: center; flex-wrap: wrap; }
.game .foot a { font-weight: 700; text-decoration: none; }
@media (max-width: 560px) {
  .game .row { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
  .game .row .t { grid-column: 1; }
  .game .t.g { flex-direction: row; text-align: start; }
  .game .row .score { grid-column: 2; grid-row: 1 / 3; flex-direction: column; gap: 4px; min-width: 46px; padding: 6px 10px; line-height: 1.15; }
  .game .row .score .sep { display: none; }
  .game .row .score.soon { min-width: 58px; }
  .sets, .game .foot { justify-content: flex-start; }
}
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.stepper .mid { font-family: var(--display); font-size: 17px; text-align: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 13px; font-weight: 700; min-height: 40px; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--band-soft); }
.btn:disabled { opacity: .4; cursor: default; }
.btn[aria-pressed="true"], .btn.hot { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }
.btn.pri { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }

/* Table */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 7px; text-align: center; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 700; background: var(--sunk); }
tbody tr:last-child td { border-bottom: 0; }
td.team, th.team { text-align: start; white-space: normal; min-width: 150px; }
td.team a { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font-weight: 700; line-height: 1.25; }
td.team a:hover { color: var(--link); }
td.pos { font-family: var(--display); width: 30px; }
td.pts { font-family: var(--display); font-size: 16px; }
tr.mine td { background: color-mix(in srgb, var(--ball) 20%, transparent); }
@media (max-width: 640px) { .x { display: none; } th, td { padding: 9px 5px; } td.team, th.team { min-width: 0; } }
.form { display: inline-flex; gap: 3px; direction: ltr; }
.form i { width: 18px; height: 18px; border-radius: 4px; font-style: normal; font-size: 10.5px; font-weight: 900; display: grid; place-items: center; color: var(--surface); background: var(--muted); }
.form i.w { background: var(--win); }
.legend { font-size: 12.5px; color: var(--muted); padding: 10px 14px; border-top: 1px solid var(--line); }

/* Tiles: teams and facts */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: center; color: var(--ink); text-decoration: none; min-width: 0; }
a.tile:hover, a.card:hover { border-color: var(--band-soft); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(10, 30, 80, .12); }
.tile b { display: block; line-height: 1.25; }
.tile small { color: var(--muted); font-size: 12.5px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px; background: var(--line); }
.facts div { background: var(--surface); padding: 12px 10px; text-align: center; }
.facts b { display: block; font-family: var(--display); font-size: 22px; line-height: 1.1; }
.facts span { font-size: 12px; color: var(--muted); }
.team-head { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.team-head h1 { font-family: var(--display); font-size: clamp(22px, 5.4vw, 32px); line-height: 1.1; text-wrap: balance; }
.team-head p { color: var(--muted); font-size: 13.5px; }
.squad { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.squad li { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.squad .no { font-family: var(--display); width: 30px; text-align: center; color: var(--muted); flex: none; }
.squad small { color: var(--muted); display: block; font-size: 12px; }

/* News */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: var(--ink); text-decoration: none; display: flex; flex-direction: column; min-width: 0; }
.card .txt { padding: 11px 13px 13px; display: grid; gap: 6px; }
.card h3 { font-size: 16px; line-height: 1.3; font-weight: 700; text-wrap: balance; }
.card .by { font-size: 12px; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; }
.card.lead { grid-column: 1 / -1; }
@media (min-width: 700px) { .card.lead { flex-direction: row; } .card.lead .cover { flex: 1.2; aspect-ratio: auto; min-height: 220px; } .card.lead .txt { flex: 1; align-content: center; padding: 20px; } .card.lead h3 { font-family: var(--display); font-size: 25px; line-height: 1.2; } }
.cover { aspect-ratio: 16 / 8; max-width: 100%; position: relative; display: grid; place-items: center; overflow: hidden; color: #fff;
  background: linear-gradient(135deg, var(--c1), var(--c2)); }
.cover::before { content: ""; position: absolute; inset: 0; opacity: .16;
  background: repeating-linear-gradient(0deg, #fff 0 1px, transparent 1px 14px), repeating-linear-gradient(90deg, #fff 0 1px, transparent 1px 14px); }
.cover::after { content: ""; position: absolute; inset: auto 0 0 0; height: 5px; background: #ffd23f; }
.cover .kicker { position: absolute; top: 10px; inset-inline-start: 10px; background: rgba(0, 0, 0, .45); color: #fff; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.cover .mid { position: relative; display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 22px; text-shadow: 0 2px 8px rgba(0,0,0,.35); text-align: center; padding: 0 12px; }
.cover .ball { width: 54px; height: 54px; }
.cover.league { --c1: #0a2d75; --c2: #2b6fd6; }
.cover.transfer { --c1: #7a1fa2; --c2: #d6336c; }
.cover.europe { --c1: #0b5d4f; --c2: #1aa37a; }
.cover.national { --c1: #0b3a8f; --c2: #1aa0c8; }
.cover.recap { --c1: #1b2440; --c2: #46557f; }
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters .btn { white-space: nowrap; border-radius: 999px; min-height: 36px; padding: 6px 14px; }
.article { max-width: 720px; margin-inline: auto; width: 100%; display: grid; gap: 16px; }
.article .cover { border-radius: 12px; aspect-ratio: 16 / 7; }
.article h1 { font-family: var(--display); font-size: clamp(24px, 6vw, 36px); line-height: 1.15; text-wrap: balance; }
.article .by { color: var(--muted); font-size: 13.5px; display: flex; gap: 4px 14px; flex-wrap: wrap; }
.article .body { display: grid; gap: 12px; font-size: 16.5px; line-height: 1.7; }
.article .body h2 { font-family: var(--display); font-size: 19px; margin-top: 6px; }
.article ul { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; }

footer { color: var(--muted); font-size: 12.5px; padding-block: 0 30px; display: grid; gap: 4px; text-align: center; }
footer strong { color: var(--ink); font-size: 14px; }
</style>

<script>
let DATA = /*__DATA__*/null;
const LIVE = /*__LIVE__*/false;
document.documentElement.lang = 'he';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const GAME_URL = 'https://www.iva.org.il/game-zone/?GameId=';
const LIVE_URL = 'https://iva-web.dataproject.com/Livescore_Adv.aspx?ID=';
const TV_URL = 'https://tv.iva.org.il/';
const state = { lg: store.get('vb-lg', 'm') === 'w' ? 'w' : 'm', round: null, onlyMine: false, cat: 'all', shown: 13 };
const fav = () => store.get('vb-fav-' + state.lg, '');
const L = () => DATA.leagues[state.lg];
const CATS = { league: 'ליגה', transfer: 'רכש והעברות', europe: 'אירופה', national: 'נבחרות', recap: 'סיכום מחזור' };

/* ---- helpers ---- */
const dOf = g => new Date(g.at);
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const fmtDay = d => d.toLocaleDateString('he-IL', { weekday: 'short', day: 'numeric', month: 'numeric' });
const fmtLong = d => d.toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtDate = s => new Date(s).toLocaleDateString('he-IL', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtTime = g => g.at.slice(11);
const byDate = (a, b) => dOf(a) - dOf(b);
function status(g) {
  if (g.hs != null) return 'done';
  const now = new Date(), d = dOf(g);
  if (sameDay(now, d) && now - d < 3 * 36e5) return 'today';
  return d < now ? 'wait' : 'soon';
}
const isOpen = g => { const s = status(g); return s === 'soon' || s === 'today'; };
function whenLabel(g) {
  const s = status(g);

  return `<a class="crumb" href="#teams">חזרה לכל הקבוצות</a>
    <div class="team-head">${badge(r.team, 'lg')}<div style="flex:1;min-width:0"><h1>${esc(r.team)}</h1>
      <p>ליגת העל ${L().name} · מקום ${r.pos}${coach ? ' · מאמן: ' + esc(coach.name) : ''}</p></div>
      <button class="btn" type="button" id="set-fav" data-team="${esc(r.team)}" aria-pressed="${isMine(r.team)}">${isMine(r.team) ? 'הקבוצה שלי' : 'סמן כקבוצה שלי'}</button></div>
    <section class="box"><div class="facts num">
      <div><b>${r.pts}</b><span>נקודות</span></div><div><b>${r.w}-${r.l}</b><span>ניצחונות-הפסדים</span></div>
      <div><b>${r.sf}:${r.sa}</b><span>מערכות</span></div><div><b>${rec(true)}</b><span>בבית</span></div>
      <div><b>${rec(false)}</b><span>בחוץ</span></div><div><b><span class="form">${formOf(r.team) || '–'}</span></b><span>5 אחרונים</span></div>
    </div></section>
    ${nextMatchHtml(r.team)}
    <div class="two">
      <div class="stack">
        <section class="box"><h2>תוצאות</h2>${done.length ? [...done].reverse().map(g => gameRow(g, true)).join('') : '<p class="empty">עוד אין תוצאות.</p>'}</section>
        <section class="box"><h2>המשחקים הבאים</h2>${open.length ? open.slice(0, 6).map(g => gameRow(g, true)).join('') : '<p class="empty">אין משחקים בלוח.</p>'}</section>
      </div>
      <div class="stack">
        <section class="box"><h2>סגל</h2>${sq.players ? `<ul class="squad">${sq.players.map(p => `<li><span class="no num">${esc(p.n || '–')}</span><span>${esc(p.name)}${p.h ? `<small class="num">${p.h} ס"מ</small>` : ''}</span></li>`).join('')}</ul>` : '<p class="empty">הסגל יופיע אחרי המשחק הראשון.</p>'}
          <p class="legend">הסגל כפי שנרשם במשחק האחרון של הקבוצה באתר האיגוד.</p></section>
        ${sq.staff ? `<section class="box"><h2>צוות מקצועי</h2><ul class="squad" style="grid-template-columns:1fr">${sq.staff.map(s => `<li><span>${esc(s.name)}<small>${esc(s.role)}</small></span></li>`).join('')}</ul></section>` : ''}
      </div>
    </div>
    ${news.length ? `<section class="stack"><div class="page-head"><h1 style="font-size:20px">כתבות על הקבוצה</h1></div><div class="cards">${news.map(a => cardHtml(a)).join('')}</div></section>` : ''}`;
}

function render() {
  const h = location.hash.slice(1) || 'home';
  let html, tab = h, m;
  if (views[h]) html = views[h]();
  else if ((m = h.match(/^t-([mw])-(\d+)$/))) { if (m[1] !== state.lg) { state.lg = m[1]; store.set('vb-lg', state.lg); } html = teamPage(m[1], +m[2]); tab = 'teams'; }
  else if (ARTICLES.some(a => a.id === h)) { const a = ARTICLES.find(x => x.id === h); html = articlePage(a); tab = a.cat === 'transfer' ? 'transfers' : 'news'; }
  else { html = views.home(); tab = 'home'; }
  document.querySelectorAll('.tabs a').forEach(a => {
    if (a.dataset.v === tab) {
      a.setAttribute('aria-current', 'page');
      const box = $('tabs'), r = a.getBoundingClientRect(), b = box.getBoundingClientRect();
      if (r.left < b.left || r.right > b.right) box.scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2);
    }
    else a.removeAttribute('aria-current');
  });
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lg === state.lg));
  $('season').textContent = DATA.season;
  $('view').innerHTML = html;
  footer();
}
function footer() {
  const up = new Date(DATA.updated);
  const time = up.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  $('foot').innerHTML = `<strong>© ${up.getFullYear() || 2026} אלי מגרפיטי. כל הזכויות שמורות.</strong>
    <span>תוצאות, טבלה וסגלים: <a href="${esc(L().url)}" target="_blank" rel="noopener">איגוד הכדורעף בישראל</a>. כותרות החדשות שייכות לאתרים שפרסמו אותן ומקשרות אליהם.</span>
    <span>הנתונים עודכנו ב-${esc(fmtDate(DATA.updated))} בשעה ${time}.${LIVE ? ' הדף בודק עדכונים כל דקה ומתרענן לבד.' : ''} תוצאה שעוד לא פורסמה באתר האיגוד מסומנת "ממתין לתוצאה".</span>`;
}
/* Live refresh on the public site: check data.json every minute, redraw only when something changed. */
async function poll() {
  try {
    const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const d = await res.json();
    if (!d || !d.leagues || !d.leagues.m || !d.leagues.w) return;
    const changed = d.rev !== DATA.rev;
    DATA = d;
    if (changed) { buildArticles(); const y = scrollY; render(); scrollTo(0, y); } else footer();
  } catch (e) {}
}
if (LIVE) {
  setInterval(() => { if (!document.hidden) poll(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
}
document.addEventListener('click', e => {
  const b = e.target.closest('button, a.chip, a[data-setlg]');
  if (!b) return;
  if (b.dataset.setlg) { state.lg = b.dataset.setlg; store.set('vb-lg', state.lg); if (b.dataset.round) state.round = +b.dataset.round; return; }
  if (b.dataset.lg) {
    state.lg = b.dataset.lg; state.round = null; state.onlyMine = false; store.set('vb-lg', state.lg);
    if (/^t-/.test(location.hash.slice(1))) location.hash = '#teams'; else render();
  }
  else if (b.id === 'prev' || b.id === 'nxt') {
    const rounds = [...new Set(L().games.filter(g => g.hs != null).map(g => g.r))].sort((x, y) => x - y);
    state.round = rounds[rounds.indexOf(state.round) + (b.id === 'nxt' ? 1 : -1)]; render();
  }
  else if (b.id === 'only-mine') { state.onlyMine = !state.onlyMine; render(); }
  else if (b.id === 'set-fav') { store.set('vb-fav-' + state.lg, isMine(b.dataset.team) ? '' : b.dataset.team); render(); }
  else if (b.dataset.cat) { state.cat = b.dataset.cat; state.shown = 13; render(); }
  else if (b.id === 'more') { state.shown += 12; render(); }
  else if (b.dataset.round) { state.round = +b.dataset.round; }
});
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });
render();
</script>

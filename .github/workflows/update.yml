name: Update site

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the data from the previous run
        uses: actions/cache/restore@v4
        with:
          path: cache/data.json
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Pull fresh data and build the page
        run: python3 build.py
      - name: Keep the data for the next run
        uses: actions/cache/save@v4
        with:
          path: cache/data.json
          key: data-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
